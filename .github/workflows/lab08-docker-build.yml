name: Lab 08 - Docker Build and Security Scan

on:
  push:
    branches:
      - feature/lab08-docker-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-security:
    name: Build and Scan Distroless Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./04-docker/compose-lab
          file: ./04-docker/compose-lab/Dockerfile.distroless
          platforms: linux/amd64
          push: false
          load: true
          tags: devops-task-api:ci-test

      - name: Verify Docker image
        run: |
          docker image inspect devops-task-api:ci-test
          docker image ls

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-task-api:ci-test
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 14
